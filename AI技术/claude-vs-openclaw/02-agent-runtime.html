<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Runtime - Claude Code vs OpenClaw</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .card {
    max-width: 960px;
    width: 100%;
    background: #1e293b;
    border-radius: 20px;
    padding: 48px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.4);
  }
  .dim-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 32px;
  }
  h1 span { color: #64748b; font-weight: 400; }
  .vs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
  .side {
    background: #0f172a;
    border-radius: 16px;
    padding: 32px;
    border: 1px solid #334155;
    position: relative;
    overflow: hidden;
  }
  .side::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .side-claude::before { background: linear-gradient(90deg, #e07c40, #f59e0b); }
  .side-openclaw::before { background: linear-gradient(90deg, #10b981, #06b6d4); }
  .side-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }
  .side-claude .side-title { color: #e07c40; }
  .side-openclaw .side-title { color: #10b981; }
  .side-subtitle {
    font-size: 15px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 28px;
  }

  /* Loop diagram */
  .loop-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .loop-ring {
    position: relative;
    width: 200px;
    height: 200px;
  }
  .loop-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(224,124,64,0.12);
    border: 2px solid #e07c40;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #e07c40;
    text-align: center;
    line-height: 1.2;
  }
  .loop-step {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .loop-step-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    border: 2px solid #e07c40;
    background: rgba(224,124,64,0.08);
  }
  .loop-step-label {
    font-size: 12px;
    font-weight: 600;
    color: #e2e8f0;
  }
  .loop-step-desc {
    font-size: 10px;
    color: #64748b;
  }
  .step-think { top: -10px; left: 50%; transform: translateX(-50%); }
  .step-tool { top: 50%; right: -24px; transform: translateY(-50%); }
  .step-observe { bottom: -10px; left: 50%; transform: translateX(-50%); }

  .loop-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* Queue diagram */
  .queue-flow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .queue-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    justify-content: center;
  }
  .gw-node {
    padding: 12px 20px;
    background: #10b981;
    color: #064e3b;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .queue-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rpc-label {
    font-size: 10px;
    font-weight: 600;
    color: #06b6d4;
    background: rgba(6,182,212,0.1);
    padding: 2px 6px;
    border-radius: 6px;
    width: 32px;
    text-align: center;
  }
  .queue-box {
    padding: 8px 16px;
    border: 2px solid #10b981;
    border-radius: 8px;
    background: rgba(16,185,129,0.08);
    font-size: 13px;
    font-weight: 600;
    color: #10b981;
    min-width: 90px;
    text-align: center;
  }
  .agent-node {
    padding: 14px 18px;
    background: #10b981;
    color: #064e3b;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    text-align: center;
    line-height: 1.3;
    flex-shrink: 0;
  }
  .arrow-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    color: #475569;
  }
  .arrow-h {
    font-size: 18px;
    color: #475569;
  }
  .queue-note {
    font-size: 11px;
    color: #64748b;
    text-align: center;
    margin-top: 8px;
    padding: 8px 16px;
    background: rgba(16,185,129,0.05);
    border: 1px solid rgba(16,185,129,0.15);
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="dim-badge">Dimension 2 of 5</div>
  <h1>Agent Runtime <span>— 运行时</span></h1>
  <div class="vs-grid">

    <!-- Claude Code -->
    <div class="side side-claude">
      <div class="side-title">Claude Code</div>
      <div class="side-subtitle">Single Async Loop</div>
      <div class="loop-container">
        <div class="loop-ring">
          <svg class="loop-svg" viewBox="0 0 200 200">
            <defs>
              <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8" fill="#e07c40"/>
              </marker>
            </defs>
            <!-- top-right arc -->
            <path d="M 100,28 A 72,72 0 0 1 172,100" fill="none" stroke="#e07c40" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah)"/>
            <!-- right-bottom arc -->
            <path d="M 172,100 A 72,72 0 0 1 100,172" fill="none" stroke="#e07c40" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah)"/>
            <!-- bottom-left-top arc -->
            <path d="M 100,172 A 72,72 0 0 1 100,28" fill="none" stroke="#e07c40" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah)"/>
          </svg>
          <div class="loop-center">Query<br>Loop</div>
          <div class="loop-step step-think">
            <div class="loop-step-icon">🧠</div>
            <span class="loop-step-label">think</span>
          </div>
          <div class="loop-step step-tool">
            <div class="loop-step-icon">🔧</div>
            <span class="loop-step-label">tool call</span>
          </div>
          <div class="loop-step step-observe">
            <div class="loop-step-icon">👁️</div>
            <span class="loop-step-label">observe</span>
          </div>
        </div>
      </div>
    </div>

    <!-- OpenClaw -->
    <div class="side side-openclaw">
      <div class="side-title">OpenClaw</div>
      <div class="side-subtitle">Per-session Queues</div>
      <div class="queue-flow">
        <div class="queue-row">
          <div class="gw-node">Gateway</div>
          <div class="arrow-group">
            <span class="arrow-h">→</span>
            <span class="arrow-h">→</span>
            <span class="arrow-h">→</span>
          </div>
          <div class="queue-col">
            <div class="queue-item">
              <span class="rpc-label">RPC</span>
              <div class="queue-box">Queue A</div>
            </div>
            <div class="queue-item">
              <span class="rpc-label">RPC</span>
              <div class="queue-box">Queue B</div>
            </div>
            <div class="queue-item">
              <span class="rpc-label">RPC</span>
              <div class="queue-box">Queue C</div>
            </div>
          </div>
          <div class="arrow-group">
            <span class="arrow-h">→</span>
            <span class="arrow-h">→</span>
            <span class="arrow-h">→</span>
          </div>
          <div class="agent-node">Pi<br>Agent</div>
        </div>
        <div class="queue-note">每个用户会话独立排队，互不干扰</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
