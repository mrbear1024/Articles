<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-agent & Routing - Claude Code vs OpenClaw</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .card {
    max-width: 960px;
    width: 100%;
    background: #1e293b;
    border-radius: 20px;
    padding: 48px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.4);
  }
  .dim-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 32px;
  }
  h1 span { color: #64748b; font-weight: 400; }
  .vs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
  .side {
    background: #0f172a;
    border-radius: 16px;
    padding: 32px;
    border: 1px solid #334155;
    position: relative;
    overflow: hidden;
  }
  .side::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .side-claude::before { background: linear-gradient(90deg, #e07c40, #f59e0b); }
  .side-openclaw::before { background: linear-gradient(90deg, #10b981, #06b6d4); }
  .side-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }
  .side-claude .side-title { color: #e07c40; }
  .side-openclaw .side-title { color: #10b981; }
  .side-subtitle {
    font-size: 15px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 28px;
  }

  /* Tree structure */
  .tree {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .tree-node {
    padding: 10px 24px;
    border: 2px solid #e07c40;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: #e07c40;
    background: rgba(224,124,64,0.06);
  }
  .tree-connector {
    position: relative;
    width: 240px;
    height: 40px;
  }
  .tree-connector svg { width: 100%; height: 100%; }
  .tree-children {
    display: flex;
    gap: 12px;
  }
  .child-node {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #0f172a;
    text-align: center;
  }
  .child-explore { background: #10b981; }
  .child-plan { background: #f59e0b; }
  .child-general { background: #3b82f6; }

  /* Route + Delegate */
  .route-flow {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .route-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .channel-label {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    width: 50px;
    text-align: right;
  }
  .dash-arr {
    color: #475569;
    font-size: 16px;
    letter-spacing: 2px;
  }
  .agent-chip {
    padding: 8px 18px;
    background: #10b981;
    color: #064e3b;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .subagent-chip {
    padding: 14px 16px;
    background: #10b981;
    color: #064e3b;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
  }
  .route-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .route-agents {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .route-sources {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .delegate-arrows {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="dim-badge">Dimension 5 of 5</div>
  <h1>Multi-agent & Routing <span>— 多智能体与路由</span></h1>
  <div class="vs-grid">

    <!-- Claude Code -->
    <div class="side side-claude">
      <div class="side-title">Claude Code</div>
      <div class="side-subtitle">Lead &rarr; Subagents</div>
      <div class="tree">
        <div class="tree-node">main</div>
        <div class="tree-connector">
          <svg viewBox="0 0 240 40">
            <line x1="120" y1="0" x2="120" y2="12" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
            <line x1="40" y1="12" x2="200" y2="12" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
            <line x1="40" y1="12" x2="40" y2="40" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
            <line x1="120" y1="12" x2="120" y2="40" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
            <line x1="200" y1="12" x2="200" y2="40" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
          </svg>
        </div>
        <div class="tree-children">
          <div class="child-node child-explore">Explore</div>
          <div class="child-node child-plan">Plan</div>
          <div class="child-node child-general">general</div>
        </div>
      </div>
    </div>

    <!-- OpenClaw -->
    <div class="side side-openclaw">
      <div class="side-title">OpenClaw</div>
      <div class="side-subtitle">Route + Delegate System</div>
      <div class="route-wrapper">
        <div class="route-sources">
          <div class="route-row">
            <span class="channel-label">slack</span>
            <span class="dash-arr">--&gt;</span>
          </div>
          <div class="route-row">
            <span class="channel-label">imsg</span>
            <span class="dash-arr">--&gt;</span>
          </div>
        </div>
        <div class="route-agents">
          <div class="agent-chip">Agent A</div>
          <div class="agent-chip">Agent B</div>
        </div>
        <div class="delegate-arrows">
          <svg width="40" height="80" viewBox="0 0 40 80">
            <path d="M 0,15 L 40,35" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
            <path d="M 0,65 L 40,45" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
          </svg>
        </div>
        <div class="subagent-chip">Subagent<br>X</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
