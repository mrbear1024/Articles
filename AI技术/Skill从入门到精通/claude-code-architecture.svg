<svg width="820" height="600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">

  <!-- Background -->
  <rect width="820" height="600" fill="#ffffff" rx="0"/>

  <!-- ==================== 用户输入 ==================== -->
  <rect x="260" y="18" width="300" height="40" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="410" y="43" text-anchor="middle" font-size="14" fill="#475569">用户输入（自然语言对话）</text>

  <!-- Arrow down -->
  <line x1="410" y1="58" x2="410" y2="78" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="404,75 410,85 416,75" fill="#94a3b8"/>

  <!-- ==================== Claude Code 核心引擎 ==================== -->
  <rect x="40" y="88" width="740" height="58" rx="10" fill="#1e293b"/>
  <text x="410" y="115" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Claude Code 核心引擎</text>
  <text x="410" y="135" text-anchor="middle" font-size="11" fill="#94a3b8">AI 推理  ·  工具调用  ·  对话管理  ·  上下文窗口</text>

  <!-- ==================== 四条连线 ==================== -->
  <line x1="145" y1="146" x2="145" y2="178" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="139,175 145,183 151,175" fill="#94a3b8"/>

  <line x1="335" y1="146" x2="335" y2="178" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="329,175 335,183 341,175" fill="#94a3b8"/>

  <line x1="525" y1="146" x2="525" y2="178" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="519,175 525,183 531,175" fill="#94a3b8"/>

  <line x1="685" y1="146" x2="685" y2="178" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="679,175 685,183 691,175" fill="#94a3b8"/>

  <!-- ==================== 四个扩展机制 ==================== -->

  <!-- CLAUDE.md -->
  <rect x="40" y="186" width="195" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="186" width="195" height="32" rx="8" fill="#059669"/>
  <rect x="40" y="208" width="195" height="10" fill="#059669"/>
  <text x="137" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">CLAUDE.md</text>
  <text x="137" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">全局规则</text>
  <text x="137" y="264" text-anchor="middle" font-size="11" fill="#64748b">始终在上下文中生效</text>
  <text x="137" y="282" text-anchor="middle" font-size="11" fill="#64748b">项目级通用约定</text>
  <text x="137" y="300" text-anchor="middle" font-size="11" fill="#64748b">无需触发</text>

  <!-- Hook -->
  <rect x="245" y="186" width="175" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="245" y="186" width="175" height="32" rx="8" fill="#ea580c"/>
  <rect x="245" y="208" width="175" height="10" fill="#ea580c"/>
  <text x="332" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Hook</text>
  <text x="332" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#ea580c">事件驱动自动化</text>
  <text x="332" y="264" text-anchor="middle" font-size="11" fill="#64748b">特定事件自动执行</text>
  <text x="332" y="282" text-anchor="middle" font-size="11" fill="#64748b">无条件触发</text>

  <!-- MCP -->
  <rect x="430" y="186" width="175" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="430" y="186" width="175" height="32" rx="8" fill="#7c3aed"/>
  <rect x="430" y="208" width="175" height="10" fill="#7c3aed"/>
  <text x="517" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">MCP</text>
  <text x="517" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">外部服务连接</text>
  <text x="517" y="264" text-anchor="middle" font-size="11" fill="#64748b">Gmail · Drive · 数据库</text>
  <text x="517" y="282" text-anchor="middle" font-size="11" fill="#64748b">标准化连接协议</text>

  <!-- Skill -->
  <rect x="615" y="186" width="165" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="615" y="186" width="165" height="32" rx="8" fill="#2563eb"/>
  <rect x="615" y="208" width="165" height="10" fill="#2563eb"/>
  <text x="697" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Skill</text>
  <text x="697" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">场景化工作流</text>
  <text x="697" y="264" text-anchor="middle" font-size="11" fill="#64748b">关键词触发</text>
  <text x="697" y="282" text-anchor="middle" font-size="11" fill="#64748b">三层渐进式加载</text>

  <!-- ==================== Skill 下方展开箭头 ==================== -->
  <line x1="697" y1="306" x2="697" y2="326" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="691,323 697,333 703,323" fill="#2563eb"/>

  <!-- ==================== 底部 Skill 生态详解区域 ==================== -->
  <rect x="40" y="336" width="740" height="248" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="60" y="360" font-size="14" font-weight="bold" fill="#1e293b">Skill 生态详解</text>

  <!-- ===== 左半区：Plugin ===== -->
  <rect x="60" y="375" width="340" height="190" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="230" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Plugin（技能容器）</text>
  <text x="230" y="415" text-anchor="middle" font-size="10" fill="#64748b">plugin.json · 统一安装 · 统一版本管理</text>

  <!-- Skill A inside Plugin -->
  <rect x="80" y="428" width="140" height="70" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="150" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">Skill A</text>
  <text x="150" y="470" text-anchor="middle" font-size="10" fill="#64748b">SKILL.md</text>
  <text x="150" y="485" text-anchor="middle" font-size="10" fill="#64748b">scripts/ · refs/</text>

  <!-- Skill B inside Plugin -->
  <rect x="240" y="428" width="140" height="70" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="310" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">Skill B</text>
  <text x="310" y="470" text-anchor="middle" font-size="10" fill="#64748b">SKILL.md</text>
  <text x="310" y="485" text-anchor="middle" font-size="10" fill="#64748b">scripts/ · refs/</text>

  <!-- Shared resources -->
  <rect x="80" y="510" width="300" height="40" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="230" y="530" text-anchor="middle" font-size="11" fill="#1e40af">shared/  共享配置 · 共享脚本 · 共享参考文档</text>
  <text x="230" y="544" text-anchor="middle" font-size="9" fill="#64748b">多个 Skill 共用的资源集中管理</text>

  <!-- ===== 右半区：三层加载 ===== -->
  <rect x="420" y="375" width="340" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="590" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">单个 Skill 的三层加载</text>

  <!-- Level 1 -->
  <rect x="440" y="415" width="300" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="460" y="436" font-size="11" font-weight="bold" fill="#92400e">Level 1</text>
  <text x="520" y="436" font-size="11" fill="#92400e">name + description</text>
  <text x="460" y="453" font-size="10" fill="#78716c">始终在上下文中 → 决定是否触发 Skill</text>

  <!-- Level 2 -->
  <rect x="440" y="470" width="300" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="460" y="491" font-size="11" font-weight="bold" fill="#1e40af">Level 2</text>
  <text x="520" y="491" font-size="11" fill="#1e40af">SKILL.md 正文</text>
  <text x="460" y="508" font-size="10" fill="#78716c">触发时加载 → 完整执行流程与规则</text>

  <!-- Level 3 -->
  <rect x="440" y="525" width="300" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="460" y="546" font-size="11" font-weight="bold" fill="#065f46">Level 3</text>
  <text x="520" y="546" font-size="11" fill="#065f46">scripts/ · references/ · assets/</text>
  <text x="460" y="563" font-size="10" fill="#78716c">按需加载 → 脚本、参考文档、模板资源</text>

</svg>
