<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三章结构图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f172a;
  display: flex;
  justify-content: center;
  padding: 48px 24px 36px;
}
.wrap {
  max-width: 880px;
  width: 100%;
}

/* 标题区 */
.header {
  text-align: center;
  margin-bottom: 40px;
}
.header h1 {
  font-size: 26px;
  font-weight: 800;
  color: #f1f5f9;
  letter-spacing: 1px;
  margin-bottom: 10px;
}
.header p {
  font-size: 14px;
  color: #64748b;
  letter-spacing: 2px;
}

/* 三栏布局 */
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  align-items: start;
}

/* 每一栏 */
.col {
  border-radius: 16px;
  overflow: hidden;
  background: #1e293b;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}

/* 栏头部渐变 */
.col-head {
  padding: 22px 20px 18px;
  position: relative;
}
.col-head .num {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 8px;
}
.col-head .title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 6px;
}
.col-head .sub {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  line-height: 1.5;
}

.col-1 .col-head { background: linear-gradient(135deg, #3b82f6, #6366f1); }
.col-2 .col-head { background: linear-gradient(135deg, #10b981, #06b6d4); }
.col-3 .col-head { background: linear-gradient(135deg, #f59e0b, #ef4444); }

/* 栏内容 */
.col-body {
  padding: 14px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* 单条目 */
.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  background: #273548;
  transition: background 0.15s;
}
.item:hover {
  background: #334155;
}
.item .dot {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
}
.col-1 .dot { background: rgba(99,102,241,0.5); }
.col-2 .dot { background: rgba(16,185,129,0.5); }
.col-3 .dot { background: rgba(245,158,11,0.5); }

.item .label {
  font-size: 13.5px;
  font-weight: 500;
  color: #cbd5e1;
  line-height: 1.45;
}

/* 栏之间的箭头 */
.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 60px;
}
.arrow svg {
  opacity: 0.3;
}

/* 底部 */
.footer {
  text-align: center;
  margin-top: 32px;
  font-size: 11px;
  color: #475569;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>沉淀与开发自己的 Skill</h1>
    <p>第三章 · 全文结构</p>
  </div>

  <div class="columns">
    <!-- Part 1 -->
    <div class="col col-1">
      <div class="col-head">
        <div class="num">PART 1</div>
        <div class="title">沉淀</div>
        <div class="sub">要不要做 · 怎么做出来</div>
      </div>
      <div class="col-body">
        <div class="item">
          <div class="dot">一</div>
          <div class="label">什么是"沉淀"</div>
        </div>
        <div class="item">
          <div class="dot">二</div>
          <div class="label">什么任务值得沉淀</div>
        </div>
        <div class="item">
          <div class="dot">三</div>
          <div class="label">沉淀的四个阶段</div>
        </div>
        <div class="item">
          <div class="dot">四</div>
          <div class="label">用 AI 帮你生成 Skill</div>
        </div>
      </div>
    </div>

    <!-- Part 2 -->
    <div class="col col-2">
      <div class="col-head">
        <div class="num">PART 2</div>
        <div class="title">开发</div>
        <div class="sub">怎么把 Skill 写好</div>
      </div>
      <div class="col-body">
        <div class="item">
          <div class="dot">五</div>
          <div class="label">SKILL.md 完整格式</div>
        </div>
        <div class="item">
          <div class="dot">六</div>
          <div class="label">description 写作技巧</div>
        </div>
        <div class="item">
          <div class="dot">七</div>
          <div class="label">自由度匹配原则</div>
        </div>
        <div class="item">
          <div class="dot">八</div>
          <div class="label">脚本与参考文件设计</div>
        </div>
      </div>
    </div>

    <!-- Part 3 -->
    <div class="col col-3">
      <div class="col-head">
        <div class="num">PART 3</div>
        <div class="title">实战与避坑</div>
        <div class="sub">完整案例 · 常见误区</div>
      </div>
      <div class="col-body">
        <div class="item">
          <div class="dot">九</div>
          <div class="label">从零开发一个完整 Skill</div>
        </div>
        <div class="item">
          <div class="dot">十</div>
          <div class="label">三个常见误区</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">SKILL 从入门到精通 · 第三章结构导读</div>
</div>
</body>
</html>
