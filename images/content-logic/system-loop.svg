<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'PingFang SC', 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d4956a"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="rgba(240,232,216,0.3)"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#0a0a0f" rx="12"/>

  <!-- 四个节点围成环形 -->
  <!-- 内容 - 左上 -->
  <rect x="120" y="60" width="160" height="70" rx="35" fill="rgba(212,149,106,0.12)" stroke="#d4956a" stroke-width="2"/>
  <text x="200" y="92" text-anchor="middle" fill="#f0e8d8" font-size="22" font-weight="700">内容</text>
  <text x="200" y="114" text-anchor="middle" fill="rgba(240,232,216,0.4)" font-size="11">生产价值</text>

  <!-- 流量 - 右上 -->
  <rect x="500" y="60" width="160" height="70" rx="35" fill="rgba(212,149,106,0.05)" stroke="rgba(240,232,216,0.2)" stroke-width="1.5"/>
  <text x="580" y="92" text-anchor="middle" fill="#f0e8d8" font-size="22" font-weight="600">流量</text>
  <text x="580" y="114" text-anchor="middle" fill="rgba(240,232,216,0.35)" font-size="11">提供曝光</text>

  <!-- 传播 - 右下 -->
  <rect x="500" y="250" width="160" height="70" rx="35" fill="rgba(212,149,106,0.05)" stroke="rgba(240,232,216,0.2)" stroke-width="1.5"/>
  <text x="580" y="282" text-anchor="middle" fill="#f0e8d8" font-size="22" font-weight="600">传播</text>
  <text x="580" y="304" text-anchor="middle" fill="rgba(240,232,216,0.35)" font-size="11">扩大触达</text>

  <!-- 用户 - 左下 -->
  <rect x="120" y="250" width="160" height="70" rx="35" fill="rgba(212,149,106,0.05)" stroke="rgba(240,232,216,0.2)" stroke-width="1.5"/>
  <text x="200" y="282" text-anchor="middle" fill="#f0e8d8" font-size="22" font-weight="600">用户</text>
  <text x="200" y="304" text-anchor="middle" fill="rgba(240,232,216,0.35)" font-size="11">积累复利</text>

  <!-- 正向箭头：内容 → 流量 -->
  <line x1="285" y1="85" x2="494" y2="85" stroke="#d4956a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="390" y="76" text-anchor="middle" fill="rgba(240,232,216,0.3)" font-size="11">决定质量</text>

  <!-- 正向箭头：流量 → 传播 -->
  <line x1="590" y1="136" x2="590" y2="244" stroke="#d4956a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="620" y="195" fill="rgba(240,232,216,0.3)" font-size="11">提供基础</text>

  <!-- 正向箭头：传播 → 用户 -->
  <line x1="494" y1="290" x2="285" y2="290" stroke="#d4956a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="390" y="282" text-anchor="middle" fill="rgba(240,232,216,0.3)" font-size="11">带来新用户</text>

  <!-- 反馈箭头：用户 → 内容（粗虚线，强调反馈） -->
  <line x1="190" y1="244" x2="190" y2="136" stroke="#d4956a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
  <text x="140" y="195" text-anchor="end" fill="#d4956a" font-size="12" font-weight="600">反哺</text>

  <!-- 中心标注 -->
  <text x="400" y="190" text-anchor="middle" fill="rgba(240,232,216,0.15)" font-size="42" font-weight="900">正循环</text>

  <!-- 底部总结 -->
  <line x1="160" y1="358" x2="640" y2="358" stroke="rgba(240,232,216,0.08)" stroke-width="1"/>
  <text x="400" y="382" text-anchor="middle" fill="rgba(240,232,216,0.4)" font-size="13">好内容筛选出好用户，好用户反哺出更好的内容</text>
</svg>
