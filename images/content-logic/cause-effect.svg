<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'PingFang SC', 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d4956a"/>
    </marker>
  </defs>

  <rect width="800" height="320" fill="#0a0a0f" rx="12"/>

  <!-- 内容 - 核心圆 -->
  <circle cx="200" cy="160" r="72" fill="none" stroke="#d4956a" stroke-width="2.5"/>
  <circle cx="200" cy="160" r="68" fill="rgba(212,149,106,0.08)"/>
  <text x="200" y="152" text-anchor="middle" fill="#f0e8d8" font-size="26" font-weight="700">内容</text>
  <text x="200" y="178" text-anchor="middle" fill="rgba(240,232,216,0.45)" font-size="13">唯一的自变量</text>

  <!-- 箭头和目标 -->
  <!-- 流量 -->
  <line x1="278" y1="120" x2="440" y2="62" stroke="#d4956a" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <rect x="450" y="36" width="130" height="52" rx="26" fill="none" stroke="rgba(240,232,216,0.2)" stroke-width="1.5"/>
  <text x="515" y="60" text-anchor="middle" fill="#f0e8d8" font-size="20" font-weight="600">流量</text>
  <text x="515" y="78" text-anchor="middle" fill="rgba(240,232,216,0.35)" font-size="11">信号 · 体检报告</text>

  <!-- 传播 -->
  <line x1="278" y1="160" x2="440" y2="160" stroke="#d4956a" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <rect x="450" y="134" width="130" height="52" rx="26" fill="none" stroke="rgba(240,232,216,0.2)" stroke-width="1.5"/>
  <text x="515" y="158" text-anchor="middle" fill="#f0e8d8" font-size="20" font-weight="600">传播</text>
  <text x="515" y="176" text-anchor="middle" fill="rgba(240,232,216,0.35)" font-size="11">桥梁 · 放大器</text>

  <!-- 用户 -->
  <line x1="278" y1="200" x2="440" y2="258" stroke="#d4956a" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <rect x="450" y="232" width="130" height="52" rx="26" fill="none" stroke="rgba(240,232,216,0.2)" stroke-width="1.5"/>
  <text x="515" y="256" text-anchor="middle" fill="#f0e8d8" font-size="20" font-weight="600">用户</text>
  <text x="515" y="274" text-anchor="middle" fill="rgba(240,232,216,0.35)" font-size="11">复利 · 真正的资产</text>

  <!-- 右侧标注 -->
  <text x="660" y="62" text-anchor="middle" fill="rgba(240,232,216,0.25)" font-size="12">因变量</text>
  <text x="660" y="162" text-anchor="middle" fill="rgba(240,232,216,0.25)" font-size="12">因变量</text>
  <text x="660" y="260" text-anchor="middle" fill="rgba(240,232,216,0.25)" font-size="12">因变量</text>
  <line x1="625" y1="72" x2="625" y2="248" stroke="rgba(240,232,216,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
</svg>
