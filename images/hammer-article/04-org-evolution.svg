<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="20" font-weight="700">组织形态的进化：从机器到网络</text>

  <!-- LEFT: Centralized / Machine Bureaucracy -->
  <g transform="translate(200, 80)">
    <text x="0" y="20" text-anchor="middle" fill="#9ca3af" font-size="14" font-weight="600">机器型官僚组织</text>
    <text x="0" y="38" text-anchor="middle" fill="#6b7280" font-size="11">明茨伯格 · Machine Bureaucracy</text>

    <!-- Central boss node -->
    <circle cx="0" cy="80" r="16" fill="#ef4444" stroke="#f87171" stroke-width="2" filter="url(#glow4)"/>
    <text x="0" y="85" text-anchor="middle" fill="white" font-size="10" font-weight="700">核心</text>

    <!-- Middle layer -->
    <circle cx="-60" cy="140" r="10" fill="#f59e0b" opacity="0.7"/>
    <circle cx="0" cy="140" r="10" fill="#f59e0b" opacity="0.7"/>
    <circle cx="60" cy="140" r="10" fill="#f59e0b" opacity="0.7"/>

    <!-- Bottom layer -->
    <circle cx="-80" cy="200" r="7" fill="#6b7280" opacity="0.5"/>
    <circle cx="-50" cy="200" r="7" fill="#6b7280" opacity="0.5"/>
    <circle cx="-20" cy="200" r="7" fill="#6b7280" opacity="0.5"/>
    <circle cx="20" cy="200" r="7" fill="#6b7280" opacity="0.5"/>
    <circle cx="50" cy="200" r="7" fill="#6b7280" opacity="0.5"/>
    <circle cx="80" cy="200" r="7" fill="#6b7280" opacity="0.5"/>

    <!-- Connections (top-down only) -->
    <line x1="0" y1="96" x2="-60" y2="130" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="96" x2="0" y2="130" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="96" x2="60" y2="130" stroke="#ef4444" stroke-width="2" opacity="0.5"/>

    <line x1="-60" y1="150" x2="-80" y2="193" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>
    <line x1="-60" y1="150" x2="-50" y2="193" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>
    <line x1="0" y1="150" x2="-20" y2="193" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>
    <line x1="0" y1="150" x2="20" y2="193" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>
    <line x1="60" y1="150" x2="50" y2="193" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>
    <line x1="60" y1="150" x2="80" y2="193" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>

    <!-- Slow feedback arrow -->
    <path d="M100,200 Q130,140 100,85" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <text x="135" y="145" fill="#ef4444" font-size="10" opacity="0.6">反馈慢</text>

    <!-- Bottleneck indicator -->
    <text x="0" y="240" text-anchor="middle" fill="#ef4444" font-size="11" opacity="0.7">⚠ 单点瓶颈</text>
    <text x="0" y="258" text-anchor="middle" fill="#6b7280" font-size="10">脆弱 · Fragile</text>
  </g>

  <!-- Arrow in middle -->
  <g transform="translate(370, 190)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3"/>
    <polygon points="55,-6 68,0 55,6" fill="#8b5cf6"/>
    <text x="34" y="20" text-anchor="middle" fill="#8b5cf6" font-size="12">进化</text>
  </g>

  <!-- RIGHT: Decentralized / Adhocracy -->
  <g transform="translate(580, 80)">
    <text x="0" y="20" text-anchor="middle" fill="#06b6d4" font-size="14" font-weight="600">去中心化网络组织</text>
    <text x="0" y="38" text-anchor="middle" fill="#6b7280" font-size="11">明茨伯格 · Adhocracy</text>

    <!-- Distributed nodes - all similar size -->
    <circle cx="0" cy="90" r="11" fill="#06b6d4" filter="url(#glow4)"/>
    <circle cx="-65" cy="110" r="11" fill="#8b5cf6" filter="url(#glow4)"/>
    <circle cx="65" cy="105" r="11" fill="#06b6d4" filter="url(#glow4)"/>
    <circle cx="-45" cy="165" r="11" fill="#06b6d4" filter="url(#glow4)"/>
    <circle cx="50" cy="170" r="11" fill="#8b5cf6" filter="url(#glow4)"/>
    <circle cx="-80" cy="175" r="10" fill="#8b5cf6" filter="url(#glow4)"/>
    <circle cx="85" cy="160" r="10" fill="#06b6d4" filter="url(#glow4)"/>
    <circle cx="0" cy="200" r="11" fill="#8b5cf6" filter="url(#glow4)"/>
    <circle cx="-30" cy="125" r="9" fill="#06b6d4" filter="url(#glow4)" opacity="0.8"/>
    <circle cx="30" cy="135" r="9" fill="#8b5cf6" filter="url(#glow4)" opacity="0.8"/>

    <!-- Dense interconnections -->
    <line x1="0" y1="90" x2="-65" y2="110" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="90" x2="65" y2="105" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="90" x2="-30" y2="125" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="0" y1="90" x2="30" y2="135" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="-65" y1="110" x2="-45" y2="165" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
    <line x1="-65" y1="110" x2="-30" y2="125" stroke="#8b5cf6" stroke-width="1.2" opacity="0.3"/>
    <line x1="-65" y1="110" x2="-80" y2="175" stroke="#8b5cf6" stroke-width="1.2" opacity="0.3"/>
    <line x1="65" y1="105" x2="50" y2="170" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    <line x1="65" y1="105" x2="85" y2="160" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="65" y1="105" x2="30" y2="135" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="-45" y1="165" x2="0" y2="200" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
    <line x1="-45" y1="165" x2="50" y2="170" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="50" y1="170" x2="0" y2="200" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="170" x2="85" y2="160" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="-80" y1="175" x2="-45" y2="165" stroke="#8b5cf6" stroke-width="1.2" opacity="0.3"/>
    <line x1="-80" y1="175" x2="0" y2="200" stroke="#8b5cf6" stroke-width="1.2" opacity="0.3"/>
    <line x1="85" y1="160" x2="0" y2="200" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="-30" y1="125" x2="-45" y2="165" stroke="#06b6d4" stroke-width="1" opacity="0.25"/>
    <line x1="30" y1="135" x2="50" y2="170" stroke="#8b5cf6" stroke-width="1" opacity="0.25"/>

    <!-- Labels -->
    <text x="0" y="240" text-anchor="middle" fill="#06b6d4" font-size="11">涌现 · 反脆弱</text>
    <text x="0" y="258" text-anchor="middle" fill="#6b7280" font-size="10">Antifragile</text>
  </g>

  <!-- Bottom theory cards -->
  <g transform="translate(0, 370)">
    <rect x="30" y="0" width="220" height="55" rx="8" fill="white" opacity="0.05"/>
    <text x="140" y="20" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">维纳 · 控制论</text>
    <text x="140" y="38" text-anchor="middle" fill="#6b7280" font-size="10">有效控制依赖反馈回路速度</text>

    <rect x="280" y="0" width="240" height="55" rx="8" fill="white" opacity="0.05"/>
    <text x="400" y="20" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">艾什比 · 必要多样性法则</text>
    <text x="400" y="38" text-anchor="middle" fill="#6b7280" font-size="10">调节者的多样性 ≥ 被调节系统</text>

    <rect x="550" y="0" width="220" height="55" rx="8" fill="white" opacity="0.05"/>
    <text x="660" y="20" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="600">圣塔菲 · 复杂适应系统</text>
    <text x="660" y="38" text-anchor="middle" fill="#6b7280" font-size="10">智能从局部交互中涌现</text>
  </g>
</svg>
