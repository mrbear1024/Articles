<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Left: Hammer (constrained) -->
  <g transform="translate(160, 180)">
    <!-- Hammer head -->
    <rect x="-40" y="-25" width="80" height="50" rx="6" fill="#6b7280" stroke="#9ca3af" stroke-width="2"/>
    <rect x="-35" y="-20" width="70" height="40" rx="4" fill="#4b5563"/>
    <!-- Handle -->
    <rect x="-8" y="25" width="16" height="80" rx="4" fill="#92400e" stroke="#b45309" stroke-width="1.5"/>
    <!-- Constraint chains -->
    <circle cx="-60" cy="0" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="-72" cy="0" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="-84" cy="0" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="60" cy="0" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="72" cy="0" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="84" cy="0" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
  </g>

  <text x="160" y="310" text-anchor="middle" fill="#9ca3af" font-size="16" font-weight="500">被锻造的锤子</text>
  <text x="160" y="335" text-anchor="middle" fill="#6b7280" font-size="13">固定形状 · 被动执行</text>

  <!-- Arrow -->
  <g transform="translate(340, 190)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="url(#arrowGrad)" stroke-width="3" stroke-dasharray="8,4"/>
    <polygon points="105,-8 120,0 105,8" fill="url(#arrowGrad)"/>
  </g>
  <text x="400" y="220" text-anchor="middle" fill="#f093fb" font-size="14" font-weight="500">重塑</text>

  <!-- Right: Water (free form) -->
  <g transform="translate(600, 140)">
    <!-- Free-flowing water shape -->
    <path d="M-60,20 Q-40,-30 -10,-25 Q20,-20 30,-40 Q50,-35 60,-10 Q70,15 50,40 Q30,60 10,70 Q-15,75 -40,60 Q-65,45 -70,25 Z"
          fill="url(#waterGrad)" opacity="0.8"/>
    <path d="M-40,30 Q-20,-10 10,-5 Q30,0 40,-20 Q50,-15 55,5 Q60,25 45,45 Q25,60 5,65 Q-20,68 -35,55 Q-50,40 -45,30 Z"
          fill="url(#waterGrad)" opacity="0.5"/>
    <!-- Sparkles -->
    <circle cx="-20" cy="10" r="3" fill="white" opacity="0.7"/>
    <circle cx="15" cy="-15" r="2" fill="white" opacity="0.5"/>
    <circle cx="30" cy="25" r="2.5" fill="white" opacity="0.6"/>
    <!-- Radiating lines -->
    <line x1="70" y1="-20" x2="90" y2="-35" stroke="#4facfe" stroke-width="1.5" opacity="0.5"/>
    <line x1="75" y1="10" x2="95" y2="10" stroke="#4facfe" stroke-width="1.5" opacity="0.5"/>
    <line x1="65" y1="50" x2="85" y2="60" stroke="#4facfe" stroke-width="1.5" opacity="0.5"/>
    <line x1="-75" y1="-15" x2="-95" y2="-25" stroke="#4facfe" stroke-width="1.5" opacity="0.4"/>
    <line x1="-70" y1="55" x2="-90" y2="65" stroke="#4facfe" stroke-width="1.5" opacity="0.4"/>
  </g>

  <text x="600" y="310" text-anchor="middle" fill="#4facfe" font-size="16" font-weight="500">回归本质的水</text>
  <text x="600" y="335" text-anchor="middle" fill="#6b7280" font-size="13">自由形态 · 无限可能</text>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="white" font-size="20" font-weight="700">从锤子到水：找回你的真实形态</text>
</svg>
