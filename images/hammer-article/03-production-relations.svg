<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="mechGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="createGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="20" font-weight="700">脑力劳动的大解放</text>

  <!-- Left: Before AI -->
  <g transform="translate(200, 60)">
    <text x="0" y="30" text-anchor="middle" fill="#9ca3af" font-size="15" font-weight="600">AI 之前</text>

    <!-- Stacked bar: 70% mechanical, 30% creative -->
    <rect x="-50" y="50" width="100" height="210" rx="6" fill="url(#mechGrad)" opacity="0.85"/>
    <rect x="-50" y="50" width="100" height="70" rx="6" fill="url(#createGrad)" opacity="0.85"/>
    <rect x="-50" y="50" width="100" height="70" rx="6" ry="0" fill="url(#createGrad)" opacity="0.85"/>
    <!-- Fix top corners only -->
    <rect x="-50" y="114" width="100" height="146" fill="url(#mechGrad)" opacity="0.85"/>

    <!-- Labels inside bars -->
    <text x="0" y="95" text-anchor="middle" fill="white" font-size="13" font-weight="500">创造性工作</text>
    <text x="0" y="115" text-anchor="middle" fill="white" font-size="11" opacity="0.8">30%</text>

    <text x="0" y="195" text-anchor="middle" fill="white" font-size="13" font-weight="500">机械性脑力</text>
    <text x="0" y="215" text-anchor="middle" fill="white" font-size="11" opacity="0.8">70%</text>

    <!-- Example items -->
    <text x="70" y="160" fill="#d97706" font-size="10">← 写报告</text>
    <text x="70" y="180" fill="#d97706" font-size="10">← 数据整理</text>
    <text x="70" y="200" fill="#d97706" font-size="10">← 翻译文档</text>
    <text x="70" y="220" fill="#d97706" font-size="10">← 常规代码</text>
    <text x="70" y="240" fill="#d97706" font-size="10">← 会议纪要</text>

    <!-- Dividing line -->
    <line x1="-50" y1="120" x2="50" y2="120" stroke="white" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  </g>

  <!-- Arrow -->
  <g transform="translate(365, 210)">
    <text x="0" y="-15" text-anchor="middle" fill="#10b981" font-size="13" font-weight="500">AI 接管</text>
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#aiGrad)" stroke-width="3"/>
    <polygon points="65,-7 80,0 65,7" fill="#34d399"/>
  </g>

  <!-- Right: After AI -->
  <g transform="translate(560, 60)">
    <text x="0" y="30" text-anchor="middle" fill="#06b6d4" font-size="15" font-weight="600">AI 之后</text>

    <!-- Stacked bar: expanded creative, small AI-handled -->
    <rect x="-50" y="50" width="100" height="210" rx="6" fill="url(#createGrad)" opacity="0.85"/>
    <rect x="-50" y="210" width="100" height="50" rx="0" fill="url(#aiGrad)" opacity="0.7"/>
    <rect x="-50" y="210" width="100" height="50" rx="6" fill="url(#aiGrad)" opacity="0.7"/>
    <!-- Cover bottom only -->
    <rect x="-50" y="50" width="100" height="160" fill="url(#createGrad)" opacity="0.85"/>

    <!-- Labels -->
    <text x="0" y="130" text-anchor="middle" fill="white" font-size="14" font-weight="600">创造性工作</text>
    <text x="0" y="155" text-anchor="middle" fill="white" font-size="12" opacity="0.8">大幅扩展</text>

    <text x="0" y="243" text-anchor="middle" fill="white" font-size="11" font-weight="500">AI 处理</text>

    <!-- Example items -->
    <text x="70" y="95" fill="#8b5cf6" font-size="10">← 洞察机会</text>
    <text x="70" y="115" fill="#8b5cf6" font-size="10">← 产品创新</text>
    <text x="70" y="135" fill="#8b5cf6" font-size="10">← 跨域连接</text>
    <text x="70" y="155" fill="#8b5cf6" font-size="10">← 战略判断</text>
    <text x="70" y="175" fill="#8b5cf6" font-size="10">← 深度思考</text>

    <!-- Dividing line -->
    <line x1="-50" y1="210" x2="50" y2="210" stroke="white" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  </g>

  <!-- Bottom: Drucker quote -->
  <rect x="100" y="340" width="600" height="40" rx="8" fill="white" opacity="0.06"/>
  <text x="400" y="365" text-anchor="middle" fill="#9ca3af" font-size="12" font-style="italic">德鲁克：知识工作者的生产力取决于自主性——他们必须自己管理自己</text>
</svg>
