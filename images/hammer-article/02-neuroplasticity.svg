<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5af19"/>
      <stop offset="100%" style="stop-color:#f12711"/>
    </linearGradient>
    <linearGradient id="dormantGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4b5563"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    <linearGradient id="newGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="20" font-weight="700">神经可塑性：你在雕刻自己的大脑</text>

  <!-- Left brain: Tool-person pattern -->
  <g transform="translate(200, 200)">
    <text x="0" y="-120" text-anchor="middle" fill="#9ca3af" font-size="15" font-weight="600">工具人模式</text>

    <!-- Active (thick) pathways - repetitive work -->
    <line x1="-60" y1="-60" x2="60" y2="-60" stroke="url(#activeGrad)" stroke-width="5" opacity="0.9" filter="url(#glow)"/>
    <line x1="-60" y1="-30" x2="60" y2="-30" stroke="url(#activeGrad)" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="url(#activeGrad)" stroke-width="4" opacity="0.8" filter="url(#glow)"/>

    <!-- Nodes on active paths -->
    <circle cx="-60" cy="-60" r="7" fill="#f5af19"/>
    <circle cx="0" cy="-60" r="7" fill="#f5af19"/>
    <circle cx="60" cy="-60" r="7" fill="#f12711"/>
    <circle cx="-60" cy="-30" r="6" fill="#f5af19"/>
    <circle cx="60" cy="-30" r="6" fill="#f12711"/>
    <circle cx="-60" cy="0" r="6" fill="#f5af19"/>
    <circle cx="60" cy="0" r="6" fill="#f12711"/>

    <!-- Dormant (thin, fading) pathways - creativity, decision-making -->
    <line x1="-50" y1="40" x2="50" y2="40" stroke="url(#dormantGrad)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="-50" y1="65" x2="50" y2="65" stroke="url(#dormantGrad)" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
    <line x1="-30" y1="85" x2="30" y2="85" stroke="url(#dormantGrad)" stroke-width="0.8" stroke-dasharray="3,6" opacity="0.2"/>

    <!-- Dormant nodes -->
    <circle cx="-50" cy="40" r="4" fill="#4b5563" opacity="0.5"/>
    <circle cx="50" cy="40" r="4" fill="#4b5563" opacity="0.5"/>
    <circle cx="-50" cy="65" r="3" fill="#4b5563" opacity="0.3"/>
    <circle cx="50" cy="65" r="3" fill="#4b5563" opacity="0.3"/>

    <!-- Labels -->
    <text x="85" y="-55" fill="#f5af19" font-size="11">执行</text>
    <text x="85" y="-25" fill="#f5af19" font-size="11">服从</text>
    <text x="85" y="5" fill="#f5af19" font-size="11">适配</text>
    <text x="75" y="45" fill="#4b5563" font-size="11">创造力 ↓</text>
    <text x="75" y="70" fill="#4b5563" font-size="11">判断力 ↓</text>
    <text x="55" y="90" fill="#374151" font-size="10">主动性 ↓</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(370, 200)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3"/>
    <polygon points="55,-6 68,0 55,6" fill="#8b5cf6"/>
  </g>
  <text x="400" y="225" text-anchor="middle" fill="#8b5cf6" font-size="13">重塑</text>

  <!-- Right brain: Creator pattern -->
  <g transform="translate(580, 200)">
    <text x="0" y="-120" text-anchor="middle" fill="#06b6d4" font-size="15" font-weight="600">创造者模式</text>

    <!-- Rich interconnected network -->
    <!-- Main nodes -->
    <circle cx="0" cy="-60" r="8" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="-55" cy="-30" r="7" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="55" cy="-30" r="7" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="-40" cy="20" r="7" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="40" cy="20" r="7" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="0" cy="55" r="7" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="-65" cy="55" r="6" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="65" cy="55" r="6" fill="#8b5cf6" filter="url(#glow)"/>

    <!-- Connections (dense, multi-directional) -->
    <line x1="0" y1="-60" x2="-55" y2="-30" stroke="url(#newGrad)" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="-60" x2="55" y2="-30" stroke="url(#newGrad)" stroke-width="2.5" opacity="0.7"/>
    <line x1="-55" y1="-30" x2="-40" y2="20" stroke="url(#newGrad)" stroke-width="2" opacity="0.6"/>
    <line x1="55" y1="-30" x2="40" y2="20" stroke="url(#newGrad)" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="20" x2="40" y2="20" stroke="url(#newGrad)" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="20" x2="0" y2="55" stroke="url(#newGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="20" x2="0" y2="55" stroke="url(#newGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-60" x2="-40" y2="20" stroke="url(#newGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-60" x2="40" y2="20" stroke="url(#newGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="-55" y1="-30" x2="40" y2="20" stroke="url(#newGrad)" stroke-width="1.5" opacity="0.35"/>
    <line x1="55" y1="-30" x2="-40" y2="20" stroke="url(#newGrad)" stroke-width="1.5" opacity="0.35"/>
    <line x1="-65" y1="55" x2="-40" y2="20" stroke="url(#newGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="65" y1="55" x2="40" y2="20" stroke="url(#newGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="-65" y1="55" x2="0" y2="55" stroke="url(#newGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="65" y1="55" x2="0" y2="55" stroke="url(#newGrad)" stroke-width="1.5" opacity="0.4"/>

    <!-- Labels around -->
    <text x="0" y="-78" text-anchor="middle" fill="#06b6d4" font-size="11">洞察</text>
    <text x="-80" y="-25" fill="#8b5cf6" font-size="11">判断</text>
    <text x="80" y="-25" fill="#06b6d4" font-size="11">创造</text>
    <text x="-65" y="15" fill="#8b5cf6" font-size="11">连接</text>
    <text x="65" y="15" fill="#06b6d4" font-size="11">探索</text>
    <text x="0" y="80" text-anchor="middle" fill="#8b5cf6" font-size="11">整合</text>
  </g>

  <!-- Bottom note -->
  <text x="400" y="380" text-anchor="middle" fill="#6b7280" font-size="12">你反复练习什么，对应的神经回路就会被强化——你在雕刻自己的大脑</text>
</svg>
