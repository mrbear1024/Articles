<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29 0%, #1a1744 50%, #24243e 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 40px;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  }
  .card {
    width: 820px; background: rgba(26, 23, 68, 0.6);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
    padding: 36px 40px; backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .card-title {
    font-size: 20px; font-weight: 700; color: #f093fb;
    margin-bottom: 6px;
  }
  .card-subtitle {
    font-size: 13px; color: #6b7280; margin-bottom: 24px;
  }
  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    border-radius: 12px; overflow: hidden;
  }
  thead th {
    background: rgba(240, 147, 251, 0.12); color: #f093fb;
    font-size: 14px; font-weight: 600; padding: 14px 16px;
    text-align: left; border-bottom: 1px solid rgba(240, 147, 251, 0.2);
  }
  tbody td {
    padding: 13px 16px; font-size: 13px; color: #c9d1d9;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(240, 147, 251, 0.04); }
  .col-level { color: #f093fb; font-weight: 600; white-space: nowrap; }
  .col-path {
    color: #43e97b; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11.5px;
    word-break: break-all;
  }
  .col-who { color: #f6d365; font-weight: 500; white-space: nowrap; }
  .col-desc { color: #8b95a5; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-title">Claude Code · 空间导向的四级指令层级</div>
    <div class="card-subtitle">指令按文件路径和目录层级组织 — 所有层级拼接生效而非覆盖</div>
    <table>
      <thead>
        <tr><th>层级</th><th>位置</th><th>谁写</th><th>作用</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-level">组织策略</td>
          <td class="col-path">/Library/Application Support/ClaudeCode/CLAUDE.md</td>
          <td class="col-who">IT 管理员</td>
          <td class="col-desc">企业级约束，不可覆盖</td>
        </tr>
        <tr>
          <td class="col-level">项目根目录</td>
          <td class="col-path">./CLAUDE.md</td>
          <td class="col-who">团队</td>
          <td class="col-desc">项目规范，提交到 Git</td>
        </tr>
        <tr>
          <td class="col-level">用户全局</td>
          <td class="col-path">~/.claude/CLAUDE.md</td>
          <td class="col-who">个人</td>
          <td class="col-desc">个人偏好，所有项目生效</td>
        </tr>
        <tr>
          <td class="col-level">子目录</td>
          <td class="col-path">./src/CLAUDE.md</td>
          <td class="col-who">团队/个人</td>
          <td class="col-desc">特定模块约定，懒加载</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
