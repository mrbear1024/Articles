<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29 0%, #1a1744 50%, #24243e 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 40px;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  }
  .card {
    width: 780px; background: rgba(26, 23, 68, 0.6);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
    padding: 36px 40px; backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .card-title {
    font-size: 20px; font-weight: 700; color: #4facfe;
    margin-bottom: 6px;
  }
  .card-subtitle {
    font-size: 13px; color: #6b7280; margin-bottom: 24px;
  }
  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    border-radius: 12px; overflow: hidden;
  }
  thead th {
    background: rgba(79, 172, 254, 0.12); color: #4facfe;
    font-size: 14px; font-weight: 600; padding: 14px 18px;
    text-align: left; border-bottom: 1px solid rgba(79, 172, 254, 0.2);
  }
  tbody td {
    padding: 13px 18px; font-size: 13px; color: #c9d1d9;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(79, 172, 254, 0.04); }
  .col-category { color: #4facfe; font-weight: 600; white-space: nowrap; }
  .col-skill { color: #e2e8f0; }
  .col-scene { color: #8b95a5; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-title">OpenClaw · 面向生活场景的 Skill 生态</div>
    <div class="card-subtitle">围绕日常生活和工作场景设计 — 给所有人用</div>
    <table>
      <thead>
        <tr><th>类别</th><th>技能</th><th>面向的场景</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-category">浏览器自动化</td>
          <td class="col-skill">网页浏览、数据抓取、表单填写</td>
          <td class="col-scene">帮用户上网查东西、下单</td>
        </tr>
        <tr>
          <td class="col-category">通信</td>
          <td class="col-skill">邮件收发、消息转发、日历管理</td>
          <td class="col-scene">帮用户处理邮件和日程</td>
        </tr>
        <tr>
          <td class="col-category">文件操作</td>
          <td class="col-skill">文件读写、整理、格式转换</td>
          <td class="col-scene">帮用户处理文档</td>
        </tr>
        <tr>
          <td class="col-category">系统操作</td>
          <td class="col-skill">Shell 命令执行、定时任务</td>
          <td class="col-scene">帮用户管理服务器</td>
        </tr>
        <tr>
          <td class="col-category">API 调用</td>
          <td class="col-skill">调用第三方 API</td>
          <td class="col-scene">接入外部服务</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
