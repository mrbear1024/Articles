<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29 0%, #1a1744 50%, #24243e 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 40px;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  }
  .card {
    width: 780px; background: rgba(26, 23, 68, 0.6);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
    padding: 36px 40px; backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .card-title {
    font-size: 20px; font-weight: 700; color: #f093fb;
    margin-bottom: 6px;
  }
  .card-subtitle {
    font-size: 13px; color: #6b7280; margin-bottom: 24px;
  }
  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    border-radius: 12px; overflow: hidden;
  }
  thead th {
    background: rgba(240, 147, 251, 0.12); color: #f093fb;
    font-size: 14px; font-weight: 600; padding: 14px 18px;
    text-align: left; border-bottom: 1px solid rgba(240, 147, 251, 0.2);
  }
  tbody td {
    padding: 13px 18px; font-size: 13px; color: #c9d1d9;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(240, 147, 251, 0.04); }
  .col-category {
    color: #f093fb; font-weight: 600; white-space: nowrap;
  }
  .col-tools {
    color: #e2e8f0; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12.5px;
  }
  .col-principle { color: #8b95a5; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-title">Claude Code · 30+ 精细化内置工具</div>
    <div class="card-subtitle">围绕编程工作流设计 — 每个工具只做一件事</div>
    <table>
      <thead>
        <tr><th>类别</th><th>工具</th><th>设计原则</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-category">文件操作</td>
          <td class="col-tools">Read、Write、Edit、Glob</td>
          <td class="col-principle">每个工具只做一件事：Read 只读，Edit 只改</td>
        </tr>
        <tr>
          <td class="col-category">命令执行</td>
          <td class="col-tools">Bash、Monitor</td>
          <td class="col-principle">Bash 执行命令，Monitor 追踪长时间运行的进程</td>
        </tr>
        <tr>
          <td class="col-category">搜索</td>
          <td class="col-tools">Grep、WebSearch、WebFetch</td>
          <td class="col-principle">代码搜索和网络调研分开</td>
        </tr>
        <tr>
          <td class="col-category">代码智能</td>
          <td class="col-tools">LSP</td>
          <td class="col-principle">跳转定义、查找引用、类型检查——编程专属能力</td>
        </tr>
        <tr>
          <td class="col-category">编排</td>
          <td class="col-tools">Agent、Skill、AskUserQuestion</td>
          <td class="col-principle">派生子智能体、调用技能、向用户提问</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
