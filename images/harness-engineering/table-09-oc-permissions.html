<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29 0%, #1a1744 50%, #24243e 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 40px;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  }
  .card {
    width: 700px; background: rgba(26, 23, 68, 0.6);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
    padding: 36px 40px; backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .card-title {
    font-size: 20px; font-weight: 700; color: #4facfe;
    margin-bottom: 6px;
  }
  .card-subtitle {
    font-size: 13px; color: #6b7280; margin-bottom: 24px;
  }
  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    border-radius: 12px; overflow: hidden;
  }
  thead th {
    background: rgba(79, 172, 254, 0.12); color: #4facfe;
    font-size: 14px; font-weight: 600; padding: 14px 18px;
    text-align: left; border-bottom: 1px solid rgba(79, 172, 254, 0.2);
  }
  tbody td {
    padding: 13px 18px; font-size: 13px; color: #c9d1d9;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(79, 172, 254, 0.04); }
  .col-mechanism {
    color: #00f2fe; font-weight: 600;
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12.5px;
  }
  .col-effect { color: #8b95a5; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-title">OpenClaw · 通道级权限 + 身份校验</div>
    <div class="card-subtitle">围绕消息通道和用户身份设计 — 防止未授权用户控制 Agent</div>
    <table>
      <thead>
        <tr><th>机制</th><th>作用</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-mechanism">dmPolicy</td>
          <td class="col-effect">控制谁可以通过私聊与 Agent 交互</td>
        </tr>
        <tr>
          <td class="col-mechanism">mentionGating</td>
          <td class="col-effect">控制群组中 @Agent 的权限</td>
        </tr>
        <tr>
          <td class="col-mechanism">Channel 白名单</td>
          <td class="col-effect">限制 Agent 只响应特定通道的消息</td>
        </tr>
        <tr>
          <td class="col-mechanism">API Key 隔离</td>
          <td class="col-effect">每个 Agent 可以使用不同的 API Key</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
